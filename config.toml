base_url = "https://marcoabbadini.github.io"
compile_sass = false
minify_html = true
generate_feeds = true
generate_sitemap = true

theme = "anemone"

default_language = "en"
title = "Marco Abbadini"

[markdown]
render_emoji = true
external_links_target_blank = true
smart_punctuation = true

[markdown.highlighting]
theme = "gruvbox-dark-medium"

[slugify]
paths = "on"
taxonomies = "off"
anchors = "on"

[link_checker]
internal_level = "warn"

[extra]
author = "Marco Abbadini"
image = ""
list_pages = false
twitter_card = false
favicon = "favicon.png"
enable_search = true

header_nav = [
  { path = "@/_index.md",          key = "nav_home",     name = "/home" },
  { path = "@/about.md",           key = "nav_about",    name = "/about" },
  { path = "@/teaching.md",        key = "nav_teaching", name = "/teaching" },
  { path = "@/research.md",        key = "nav_research", name = "/research" },
  { path = "@/posts/_index.md",    key = "nav_posts",    name = "/posts" },
  { path = "@/contacts.md",        key = "nav_contacts", name = "/contacts" },
  { url = "https://cs.unibg.it/abbadini", name = "/UNIBG" },
  { url = "https://software.imdea.org/people/marco.abbadini/", name = "/IMDEA" }
]
